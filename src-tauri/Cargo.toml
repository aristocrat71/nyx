[package]
name = "nyx"
version = "0.2.0"
description = "Share your screen, not everything on it."
authors = ["Unravel"]
edition = "2024"

[lib]
# Distinct from the bin name, which collides on Windows otherwise.
name = "nyx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
base64 = "0.21"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-quartz-core = "0.3"
objc2-io-surface = "0.3"
objc2-core-media = "0.3"
objc2-core-video = { version = "0.3", features = ["objc2-io-surface"] }
objc2-screen-capture-kit = "0.3"
objc2-application-services = "0.3"
objc2-security = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
