name: ci

# Every PR and every push to main: run the tests and assemble the bundle the
# release ships, so a tag can't be the first time the universal build is tried.
# Dispatch it by hand to get an unsigned DMG to sideload from any branch.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macOS 26 pinned for swift-tools 6.2, matching release.yml.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the tests
        run: make test

      # Ad-hoc signed: the Developer ID key lives in the gated `release`
      # environment and a sideload test doesn't need it.
      - name: Assemble the app and DMG
        env:
          NYX_UNIVERSAL: "1"
        run: |
          make app
          make dmg
          lipo -info build/Nyx.app/Contents/MacOS/Nyx

      - name: Upload the unsigned DMG
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nyx-unsigned-dmg
          path: build/Nyx-*.dmg
          if-no-files-found: error
