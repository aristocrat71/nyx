name: pages

# Manual only. There is deliberately no push trigger: merging to main changes
# the repo, never the published site — you publish by running this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

# Let a running publish finish rather than cancelling it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # publish the artifact to Pages
      id-token: write # OIDC token deploy-pages verifies the upload with
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Staged file by file: the repo root is a Swift package, and everything
      # not copied here is everything the site must not serve.
      - name: Stage the site
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html _site/
          for f in nyx-logo.png nyx-how-it-works.png Unravel_Logo_-_Transparent.png; do
            cp "assets/$f" _site/assets/
          done
          # A referenced file missing here is a 404 nobody sees until the page is live.
          missing=0
          for ref in $(grep -oE '(src|href)="(assets/[^"]+|[^":/#][^":]*\.(css|js|png|svg))"' _site/index.html \
                       | sed -E 's/^(src|href)="//; s/"$//' | sort -u); do
            [ -f "_site/$ref" ] || { echo "::error::index.html references $ref, which is not staged"; missing=1; }
          done
          [ "$missing" -eq 0 ]
          find _site -type f | sort

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
