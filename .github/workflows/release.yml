name: release

# Pushing a tag like nyx-v0.2.0 builds every platform and publishes a GitHub Release
# whose body is that version's CHANGELOG.md section.
on:
  push:
    tags:
      - "nyx-v*"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      # Actions pinned to full commit SHAs so a repointed tag cannot inject code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Refuse a tag that is not on main
        run: |
          git fetch --no-tags -q origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main."
            exit 1
          fi

      - name: Check every version matches the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#nyx-v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          bad=0
          for pair in "package.json=$(jq -r .version package.json)" \
                      "src-tauri/tauri.conf.json=$(jq -r .version src-tauri/tauri.conf.json)" \
                      "src-tauri/Cargo.toml=$cargo"; do
            if [ "${pair#*=}" != "$version" ]; then
              echo "::error::${pair%%=*} says ${pair#*=} but the tag says $version."
              bad=1
            fi
          done
          exit $bad

      - name: Extract release notes
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#nyx-v}"
          body=$(awk -v v="$version" '
            { sub(/\r$/, "") }
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { lines[++n] = $0; if (NF) { if (!first) first = n; last = n } }
            END { if (first) for (i = first; i <= last; i++) print lines[i] }
          ' CHANGELOG.md)
          [ -n "$body" ] || { echo "::error::CHANGELOG.md has no '## [$version]' section."; exit 1; }
          # A line equal to the delimiter would end the output early and forge the rest.
          if printf '%s\n' "$body" | grep -qx 'CHANGELOG_EOF'; then
            echo "::error::CHANGELOG.md contains the delimiter CHANGELOG_EOF"; exit 1
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            printf '%s\n' "$body"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: guard
    # Add a required reviewer under Settings → Environments → release to pause here.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # Mac only for now, to save Actions minutes: add ubuntu-22.04 and windows-latest to ship those.
        platform: [macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev

      - run: bun install --frozen-lockfile

      - name: Build and release
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ needs.guard.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }}

      # A <file>.sha256 beside each installer so a download can be checked before opening it.
      - name: Publish SHA-256 checksums
        id: sums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          sha() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          echo 'paths<<EOF' >> "$GITHUB_OUTPUT"
          n=0
          while read -r f; do
            f="${f%$'\r'}"
            f="${f//\\//}"
            case "$f" in *.dmg|*.AppImage|*.deb|*.rpm|*.exe|*.msi) ;; *) continue ;; esac
            [ -f "$f" ] || { echo "::error::installer not found: $f"; exit 1; }
            ( cd "$(dirname "$f")" && sha "$(basename "$f")" ) > "$f.sha256"
            gh release upload "$GITHUB_REF_NAME" "$f.sha256" --clobber
            echo "$f" >> "$GITHUB_OUTPUT"
            n=$((n + 1))
          done < <(jq -r '.[]' <<< "$PATHS")
          # Fixed names: Nyx.dmg for new installs, Nyx-update.dmg for the updater, so their
          # download counts tell the two apart.
          for f in $(grep '\.dmg$' "$GITHUB_OUTPUT" || true); do
            for name in Nyx.dmg Nyx-update.dmg; do
              cp "$f" "$name" && sha "$name" > "$name.sha256"
              gh release upload "$GITHUB_REF_NAME" "$name" "$name.sha256" --clobber
            done
          done
          echo 'EOF' >> "$GITHUB_OUTPUT"
          [ "$n" -gt 0 ] || { echo "::error::no installers found"; exit 1; }

      # Verify a download with: gh attestation verify <file> --repo aristocrat71/nyx
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.sums.outputs.paths }}
